name: Calculator CI

on: [push]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest==8.3.5

      - name: Build calculator package
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Run five unit tests
        run: >
          python -m pytest -v -k
          "test_sum or test_subtract or test_multiply or test_division or test_square_root"
